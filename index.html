<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GHOSTNET | Stealth Relay</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div id="watermark" class="hidden">
        <span id="wm-user"></span><br>
        <span id="wm-room"></span><br>
        <span>[ TOP SECRET ]</span>
    </div>

    <div class="container">
        <div id="auth-panel" class="glass-panel hud-panel">
            <div class="hud-corner top-left"></div>
            <div class="hud-corner bottom-right"></div>
            
            <div class="panel-content">
                <div class="system-status"><span class="blink">●</span> SECURE ONION ROUTING ACTIVE</div>
                
                <h1 class="glitch" data-text="GHOSTNET">GHOSTNET</h1>
                
                <div class="cyber-badges">
                    <span class="badge">HIGH PRIVACY</span>
                    <span class="badge">ZERO-LOGS</span>
                    <span class="badge">LSB STEGO</span>
                    <span class="badge danger">IMPOSSIBLE TO DECODE</span>
                </div>
                
                <div class="input-group mt-2">
                    <input type="text" id="username" placeholder="ENTER ALIAS [GHOST_###]..." autocomplete="off">
                </div>
                <div class="actions">
                    <button id="btn-create" class="cyber-btn primary full-width">
                        <span class="btn-text">INITIALIZE SESSION</span>
                    </button>
                </div>
                
                <div class="divider">
                    <span class="micro-text">OR ESTABLISH LINK</span>
                </div>

                <div class="input-group mt-2">
                    <input type="text" id="join-code" placeholder="ENTER ROOM CIPHER..." autocomplete="off">
                    <button id="btn-join" class="cyber-btn outline">CONNECT</button>
                </div>

                <div class="creator-signature">
                    <span class="sig-title">root architect</span>
                    <span class="sig-name">harpinder singh</span>
                </div>
            </div>
        </div>

        <div id="chat-panel" class="glass-panel hud-panel hidden">
            <div class="hud-corner top-left"></div>
            <div class="hud-corner bottom-right"></div>

            <div class="chat-header">
                <div class="room-info">
                    <span class="system-status warning"><span class="blink">●</span> SECURE TUNNEL ACTIVE</span>
                    <h2 class="mobile-h2">LINK: <span id="current-room" class="cyan-glow text-select"></span></h2>
                </div>
                <button id="btn-panic" class="cyber-btn panic icon-only-mobile">WIPE</button>
            </div>
            
            <div class="terminal-logs" id="terminal">
                <span class="micro-text">> BOOT SEQUENCE INITIATED...</span>
            </div>
            
            <div id="chat-box" class="chat-box"></div>
            
            <div id="reply-indicator" class="reply-indicator hidden">
                <div class="reply-content">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>
                    <span id="reply-to-user" class="micro-text" style="color: #fff; margin-left: 5px;"></span>
                </div>
                <button onclick="cancelReply()" class="btn-close-reply">✖</button>
            </div>

            <div class="input-area">
                <button id="btn-stego" class="icon-btn" title="Inject LSB Payload">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
                <input type="text" id="message-input" placeholder="Type raw data..." autocomplete="off">
                <button id="btn-send" class="cyber-btn primary">
                    <svg class="mobile-send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    <span class="desktop-send-text">SEND</span>
                </button>
            </div>
        </div>

        <div id="stego-modal" class="glass-panel hud-panel hidden stego-modal-box">
            <div class="hud-corner top-left"></div>
            <div class="hud-corner bottom-right"></div>
            
            <div class="panel-content">
                <div class="system-status"><span class="blink">●</span> MODULE // LSB.STEGO.04</div>
                <h3 class="cyan-glow" style="margin: 15px 0 5px 0;">INJECT PAYLOAD</h3>
                <p style="color: var(--green); font-size: 0.75rem; margin-bottom: 25px; letter-spacing: 1px;">IMAGE COMPRESSION ACTIVE</p>
                
                <input type="file" id="stego-file" accept="image/png, image/jpeg" class="file-input">
                <input type="text" id="stego-secret" placeholder="Enter Secret Payload..." autocomplete="off" style="margin-bottom: 25px;">
                
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button id="btn-stego-send" class="cyber-btn primary">ENCODE</button>
                    <button id="btn-stego-cancel" class="cyber-btn panic outline-panic">ABORT</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/itd.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
